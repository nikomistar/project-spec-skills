        const GAP_PORTION = 40;
        let gapState = "open", // "open", one of the open states, or "history"
          gapShown = GAP_PORTION,
          gapSort = "urgent", // "urgent" (state, then priority) or "newest" (the day the gap appeared)
          gapArea = "",
          gapKind = "",
          gapTopic = "", // "" for all, "none" for gaps without one, otherwise the value
          gapReview = "", // "" for all, otherwise the review that wrote the gap
          gapLow = false, // the low-priority gaps of the queue are folded away until asked for
          gapWords = "", // every word must be in the gap's title, summary, path or text
          gapPriority = ""; // "" for all, "none" for gaps without one, otherwise the value
        const selectOf = (label, options, value, pick) => {
          const s = el("select");
          s.setAttribute("aria-label", label);
          options.forEach(([v, text]) => {
            const o = el("option", text);
            o.value = v;
            s.append(o);
          });
          s.value = value;
          s.addEventListener("change", () => pick(s.value));
          return s;
        };
        const areaOptions = () => [["", "All areas"], ...areas.map((a) => [a.id, a.title])];
        // The queue is a work list: one row of title and filters, then the gaps.
        const gapText = new Map();
        const textOfGap = (g) => {
          if (!gapText.has(g.id)) gapText.set(g.id, [g.title, str(g.summary), repoPath(g), bodyOf(g)].join("\n").toLowerCase());
          return gapText.get(g.id);
        };
        function viewGaps(view) {
          const box = el("div", null, "stack compact"),
            head = el("div", null, "map-head"),
            filters = el("div", null, "filters"),
            // The tabs and the list are redrawn on their own, so typing in the word field does not replace it.
            above = el("div", null, "stack compact"),
            below = el("div", null, "stack compact"),
            again = () => {
              gapShown = GAP_PORTION;
              show();
            };
          head.append(el("h1", "Gaps"));
          head.title = "Questions about what is missing, unverified or could be added. Each one is rechecked and then decided by a person.";
          const kinds = Object.keys(kindLabels);
          nodes.forEach((n) => {
            if (isGap(n) && str(n.kind) && !kinds.includes(n.kind)) kinds.push(n.kind);
          });
          const words = el("input");
          words.type = "search";
          words.placeholder = "Find in gaps";
          words.setAttribute("aria-label", "Words");
          words.value = gapWords;
          words.addEventListener("input", () => {
            gapWords = words.value;
            gapShown = GAP_PORTION;
            paint();
          });
          filters.append(
            words,
            selectOf("Area", areaOptions(), gapArea, (v) => {
              gapArea = v;
              again();
            }),
            selectOf("Kind", [["", "All kinds"], ...kinds.map((k) => [k, kindLabels[k] || k])], gapKind, (v) => {
              gapKind = v;
              again();
            }),
          );
          // Only the topics the queue has, in the order the format lists them; nothing to pick when no gap has one.
          const topics = [...new Set(nodes.filter(isGap).map(topicOf).filter(Boolean))].sort((a, b) => {
            const order = Object.keys(topicLabels),
              at = (t) => (order.includes(t) ? order.indexOf(t) : order.length);
            return at(a) - at(b) || a.localeCompare(b);
          });
          if (topics.length || gapTopic)
            filters.append(
              selectOf("Topic", [["", "All topics"], ...topics.map((t) => [t, topicLabel(t)]), ["none", "No topic"]], gapTopic, (v) => {
                gapTopic = v;
                again();
              }),
            );
          // Only the reviews that gaps name; nothing to pick when no gap says which review wrote it.
          const found = [...new Set(nodes.map(foundBy).filter(Boolean))].sort();
          if (found.length || gapReview)
            filters.append(
              selectOf("Found by", [["", "Any pass"], ...found.map((r) => [r, reviewLabel(r)])], gapReview, (v) => {
                gapReview = v;
                again();
              }),
            );
          // Only the priorities the queue has, most urgent first; nothing to pick when no gap has one.
          const priorities = [...new Set(nodes.filter(isGap).map(priorityOf).filter(Boolean))].sort(
            (a, b) => priorityRank({ priority: a }) - priorityRank({ priority: b }) || a.localeCompare(b),
          );
          if (priorities.length || gapPriority)
            filters.append(
              selectOf(
                "Priority",
                [
                  ["", "All priorities"],
                  ...priorities.map((p) => [p, p[0].toUpperCase() + p.slice(1) + " priority"]),
                  ["none", "No priority"],
                ],
                gapPriority,
                (v) => {
                  gapPriority = v;
                  again();
                },
              ),
            );
          const order = selectOf(
            "Order",
            [
              ["urgent", gapState === "history" ? "Last closed first" : "Most urgent first"],
              ["newest", "Newest first"],
            ],
            gapSort,
            (v) => {
              gapSort = v;
              again();
            },
          );
          order.className = "push";
          filters.append(order);
          const anyFilter = () => gapArea || gapKind || gapTopic || gapReview || gapPriority || gapWords.trim();
          const paint = () => {
            const asked = gapWords.toLowerCase().split(/\s+/).filter(Boolean),
              pool = nodes.filter(
                (n) =>
                  isGap(n) &&
                  inArea(n, gapArea) &&
                  (!gapKind || n.kind === gapKind) &&
                  (!gapTopic || (topicOf(n) || "none") === gapTopic) &&
                  (!gapReview || foundBy(n) === gapReview) &&
                  (!gapPriority || (priorityOf(n) || "none") === gapPriority) &&
                  asked.every((w) => textOfGap(n).includes(w)),
              ),
              history = pool.filter(isClosed).length;
            above.replaceChildren(
              head,
              tabs(
                "State",
                // The queue is the open work; what is closed is one step away, under History. A state with
                // no gaps under the current filters is left out, unless it is the one selected.
                [
                  ["open", "Open", pool.length - history],
                  ...OPEN_STATES.map((s) => [s, stateLabels[s], pool.filter((g) => stateOf(g) === s).length]),
                  ["history", "History", history],
                ].filter(([s, , count]) => count || s === gapState || s === "open"),
                gapState,
                (s) => {
                  gapState = s;
                  again();
                },
              ),
            );
            below.replaceChildren();
            if (stateHints[gapState]) below.append(el("p", stateHints[gapState], "muted small"));
            const listed = pool
              .filter((g) => (gapState === "open" ? !isClosed(g) : gapState === "history" ? isClosed(g) : stateOf(g) === gapState))
              .sort(gapSort === "newest" ? byAdded : gapState === "history" ? byClosed : byGapOrder);
            // A long queue is mostly small things. The low-priority gaps of the open work are folded away until
            // someone asks for them: by the button, by the priority filter or by searching for words.
            const isLow = (g) => priorityRank(g) === 3 || priorityRank(g) === 4,
              rest = listed.filter((g) => !isLow(g)),
              canFold = gapState !== "history" && !gapPriority && !asked.length && rest.length > 0 && rest.length < listed.length,
              shown = canFold && !gapLow ? rest : listed,
              folded = listed.length - shown.length;
            if (shown.length) {
              // A long queue comes in portions: the most urgent are in the first one, the rest one press away.
              const card = el("section", null, "card"),
                more = el("div", null, "more-row");
              card.id = "gap-list";
              const fill = () => {
                const upto = Math.min(gapShown, shown.length);
                card.replaceChildren(...shown.slice(0, upto).map(gapRow));
                more.replaceChildren();
                if (shown.length <= GAP_PORTION) return;
                if (upto < shown.length)
                  more.append(
                    button("Show " + Math.min(GAP_PORTION, shown.length - upto) + " more", "btn", () => {
                      gapShown += GAP_PORTION;
                      fill();
                    }),
                  );
                more.append(el("span", upto + " of " + shown.length, "muted small"));
              };
              fill();
              below.append(card, more);
              if (canFold) {
                const low = el("div", null, "more-row");
                low.id = "gap-low";
                if (folded) low.append(el("span", plural(folded, "low-priority gap") + (folded === 1 ? " is" : " are") + " folded away.", "muted small"));
                low.append(
                  button(folded ? "Show " + (folded === 1 ? "it" : "them") : "Fold the low-priority gaps", "btn", () => {
                    gapLow = !gapLow;
                    again();
                  }),
                );
                below.append(low);
              }
            } else {
              const none = el("p", gapState === "history" && !anyFilter() ? "Nothing is closed yet." : "No gaps match. Try other filters.", "empty");
              below.append(none);
              if (anyFilter())
                below.append(
                  button("Clear the filters", "btn", () => {
                    gapArea = gapKind = gapTopic = gapReview = gapPriority = gapWords = "";
                    again();
                  }),
                );
            }
          };
          paint();
          box.append(above, filters, below);
          view.append(box);
        }

        let mapArea = "";
        function viewMap() {
          const gaps = mode === "gap";
          $("#map-title").textContent = gaps ? "Gap map" : "Spec map";
          graph.setAttribute(
            "aria-label",
            gaps
              ? "Map of gaps and their plans, with the spec pages they refer to, one frame per area. Every page is also in the tree."
              : "Map of how the spec pages link, one frame per area. Every page is also in the tree.",
          );
          const controls = $("#map-controls");
          controls.replaceChildren(
            ...pills("Map layer", [["spec", "Spec"], ["gap", "Gaps"]], mode, (m) => {
              mode = m;
              show();
            }).children,
            selectOf("Area", areaOptions(), mapArea, (v) => {
              mapArea = v;
              show();
            }),
          );
          const shown = gaps
            ? nodes.filter((n) => isGap(n) && inArea(n, mapArea)).sort(byGapOrder)
            : nodes.filter((n) => layerOf(n) === "spec" && inArea(n, mapArea));
          draw(graphModel(shown), false);
        }

        let changeFilter = "all";
        const statusWord = { added: "New", removed: "Removed", changed: "Updated" };
        const pageByFile = (path) => byPath.get(String(path || "").replace(/\.md$/i, ""));
        const inFilter = (path) =>
          changeFilter === "spec"
            ? /^(areas|notes)\//.test(path)
            : changeFilter === "gaps"
              ? /^(gaps|plans)\//.test(path)
              : true;
        // One line per page: what happened, its name (a link when the page exists), its file.
        const pageRow = (entry) => {
          const row = el("div", null, "row slim"),
            grow = el("div", null, "grow"),
            n = pageByFile(entry.path);
          if (entry.status) row.append(el("span", statusWord[entry.status] || str(entry.status), "tag " + str(entry.status)));
          grow.append(n ? button(n.title, "rowlink", () => openNode(n)) : el("span", str(entry.path)));
          row.append(grow);
          if (n) row.append(el("span", str(entry.path), "path"));
          if (str(entry.was) && str(entry.now)) {
            const what = el("details", null, "what"),
              box = el("div", null, "wasnow"),
              was = el("div", null, "was"),
              now = el("div");
            was.append(el("b", "was"), el("span", entry.was));
            now.append(el("b", "now"), el("span", entry.now));
            box.append(was, now);
            what.append(el("summary", "What changed"), box);
            row.append(what);
          }
          return row;
        };
        const GROUPS = [
          ["Spec pages", /^(areas|notes)\//],
          ["Gaps and plans", /^(gaps|plans)\//],
          ["Other pages", /^/],
        ];
        // Rows sorted into spec, gaps and the rest, with a label per group when there is more than one.
        function groupedRows(parent, entries) {
          const left = entries.slice(),
            groups = GROUPS.map(([label, test]) => {
              const mine = left.filter((p) => test.test(str(p.path)));
              mine.forEach((p) => left.splice(left.indexOf(p), 1));
              return [label, mine];
            }).filter(([, mine]) => mine.length);
          groups.forEach(([label, mine]) => {
            if (groups.length > 1) parent.append(el("div", label + " · " + mine.length, "mono-label group"));
            mine.forEach((p) => parent.append(pageRow(p)));
          });
        }
        const rereadBrief = () =>
          "Use the project-knowledge skill. These pages cite sources that changed since the last review. " +
          "Re-read each page against its sources, update the text where the code now differs, and accept the fingerprints only for pages you re-read.\n\n" +
          rereads
            .map((n) => "- " + repoPath(n) + (changedSources.has(n.path) ? " (changed: " + changedSources.get(n.path).join(", ") + ")" : ""))
            .join("\n");
        const errorsBrief = () =>
          "Use the project-knowledge skill. Its check command reports these errors in the spec. " +
          "Fix each one on the page it names, change nothing else on that page, and run check again until it reports none.\n\n" +
          specErrors
            .flatMap((x) => x.texts.map((t) => "- " + (x.path ? repoPath({ path: x.path }) + ": " : "") + t))
            .join("\n");
        // Every error at once, grouped by the page it is on. A page that could not be read is not in the viewer.
        function errorsCard() {
          const card = el("section", null, "card notice"),
            head = el("div", null, "card-head"),
            copy = button(null, "btn accent", () => copyText(errorsBrief(), "Copied " + plural(errorCount, "error")));
          card.id = "errors";
          copy.append(icon(ICON.copy), document.createTextNode("Copy for AI"));
          head.append(el("div", "The spec has " + plural(errorCount, "error"), "h2"), copy);
          card.append(head);
          specErrors.forEach((x) => {
            const row = el("div", null, "row"),
              grow = el("div", null, "grow"),
              n = x.path ? pageByFile(x.path) : null,
              list = el("ul", null, "errs");
            grow.append(n ? button(n.title, "rowlink", () => openNode(n)) : el("b", x.path ? "Not shown" : "The whole spec"));
            if (x.path) grow.append(el("span", x.path, "path"));
            x.texts.forEach((t) => list.append(el("li", t)));
            row.append(grow, list);
            card.append(row);
          });
          return card;
        }
        function viewChanges(view) {
          const box = el("div", null, "stack");
          box.append(
            header(
              "Recent changes",
              ["The code moved.", "See what the spec did."],
              "Pages whose sources changed since someone last read them, then every edit to the spec and the gap queue, newest first.",
            ),
          );
          const options = [["all", "Everything"], ["spec", "Spec pages"], ["gaps", "Gaps"]];
          if (newCommits) options.push(["new", "Since my last visit", newCommits]);
          if (!options.some(([v]) => v === changeFilter)) changeFilter = "all";
          box.append(
            pills("Show", options, changeFilter, (v) => {
              changeFilter = v;
              show();
            }),
          );
          if (errorCount)
            box.append(
              errorsCard(),
              el("p", "What the check command reports, all of it. The pages are shown as they are; one marked Not shown could not be read at all.", "muted small"),
            );
          const stale = rereads.filter((n) => inFilter(n.path));
          if (stale.length && changeFilter !== "new") {
            const card = el("section", null, "card notice"),
              head = el("div", null, "card-head"),
              text = el("div", null, "h2"),
              copy = button(null, "btn accent", () => copyText(rereadBrief(), "Copied " + plural(rereads.length, "page")));
            card.id = "rereads";
            text.textContent = plural(stale.length, "page") + (stale.length === 1 ? " needs" : " need") + " re-reading";
            copy.append(icon(ICON.copy), document.createTextNode("Copy for AI"));
            head.append(text, copy);
            card.append(head);
            stale.forEach((n) => {
              const row = el("div", null, "row"),
                grow = el("div", null, "grow");
              grow.append(button(n.title, "rowlink", () => openNode(n)), el("span", str(n.path), "path"));
              row.append(grow);
              (changedSources.get(n.path) || []).forEach((src) => {
                const s = el("span", null, "path");
                s.append(sourceLine(src));
                row.append(s);
              });
              card.append(row);
            });
            box.append(
              card,
              el("p", "A file these pages cite changed after the last review. The text may still be right; nobody has checked.", "muted small"),
            );
          }
          const waitingCommit = pendingPages.filter((p) => inFilter(str(p.path)));
          if (waitingCommit.length && changeFilter !== "new") {
            const card = el("section", null, "card"),
              head = el("div", null, "card-head");
            card.id = "pending";
            head.append(el("h2", "Not committed yet", "h2"), el("span", plural(waitingCommit.length, "page"), "path"));
            card.append(head);
            groupedRows(card, waitingCommit);
            box.append(card);
          }
          box.append(
            el("h2", "History", "h2"),
            el("p", "One line per commit. Open a commit to see its pages; a page name opens the page.", "muted small"),
          );
          let any = false,
            shownCommits = 0;
          historyLog.forEach((c, i) => {
            if (changeFilter === "new" && i >= newCommits) return;
            const pages = (Array.isArray(c.pages) ? c.pages : []).filter((p) => p && inFilter(str(p.path)));
            if (!pages.length) return;
            any = true;
            const card = el("article", null, "card commit"),
              open = el("details"),
              head = el("summary", null, "card-head"),
              text = el("div", null, "grow"),
              more = c.more && changeFilter === "all" ? c.more : 0;
            // New commits and the newest one start open; the rest are one line each.
            open.open = i < newCommits || shownCommits === 0;
            shownCommits++;
            text.append(
              el("div", str(c.date) + " · commit " + str(c.sha).slice(0, 7) + (i < newCommits ? " · new" : ""), "eyebrow"),
              el("h3", str(c.subject), "h3"),
            );
            head.append(text, el("span", plural(pages.length + more, "page"), "path"), icon(ICON.chevron));
            open.append(head);
            groupedRows(open, pages);
            if (more) {
              const rest = el("div", null, "row slim");
              rest.append(el("span", "and " + plural(more, "more page"), "muted small"));
              open.append(rest);
            }
            card.append(open);
            box.append(card);
          });
          if (!any)
            box.append(
              el(
                "p",
                historyLog.length
                  ? "Nothing in the history matches this filter."
                  : live || built
                    ? "No Git history was found for this vault."
                    : "History is shown when the spec is opened with the serve command.",
                "empty",
              ),
            );
          view.append(box);
          if (historyLog.length) store.set("seen", historyLog[0].sha);
        }

        // --- Copy for AI: one dialog that turns a page and your words into a request for the agent ----
        // Each choice says what will happen, what to ask you for, and what the agent is told.
        const INTENTS = {
          recheck: {
            label: "Recheck it",
            hint: "The agent reads the code and writes what it found into the gap. You decide afterwards.",
            ask: "Anything it should look at (optional)",
            text: (c) =>
              "Use the project-knowledge skill to re-check this gap against the code. Write the result into the gap's Recheck section and leave the decision to me." +
              (c.note ? "\n\nLook at: " + c.note : ""),
          },
          checked: {
            label: "I checked it myself",
            hint: "You already verified this. The agent records your result under your name, and closes the gap if that settles it.",
            ask: "What you checked and what you saw",
            name: true,
            choices: ["outcome", [["gone", "It is fine now"], ["holds", "Still a gap"]]],
            text: (c) =>
              c.outcome === "holds"
                ? "Use the project-knowledge skill. I re-checked this gap myself and it still holds: " + (c.note || "[what you checked and saw]") +
                  "\n\nRecord my recheck in the gap as confirmed, under my name (" + c.me + ") and today's date, with what I found in its Recheck section. Leave the decision open."
                : "Use the project-knowledge skill. I re-checked this gap myself and it no longer holds: " + (c.note || "[what you checked and saw]") +
                  "\n\nRecord my recheck in the gap as not reproduced, under my name (" + c.me + ") and today's date, with what I found in its Recheck section. " +
                  "If that answers the question, close the gap as done and say why in its Decision section.",
          },
          decide: {
            label: "Record my decision",
            hint: "You have made up your mind. The agent writes your decision into the gap under your name; it does not decide anything itself.",
            ask: "Why (one or two sentences)",
            name: true,
            choices: ["decision", [["accepted", "Accept"], ["rejected", "Reject"], ["deferred", "Defer"]]],
            text: (c) =>
              "Use the project-knowledge skill. I have decided this gap: " + c.decision + ". Reason: " + (c.note || "[why]") +
              "\n\nRecord the decision in the gap under my name (" + c.me + ") with today's date, and my reason in its Decision section. Change nothing else. " +
              "If the gap has not been rechecked yet, tell me before recording it.",
          },
          options: {
            label: "Lay out options",
            hint: "The agent writes the possible answers and what each would mean into the gap's Discussion. Nothing is decided.",
            ask: "What matters to you here (optional)",
            text: (c) =>
              "Use the project-knowledge skill. Lay out the options for this gap, with what each would mean, as an entry in its Discussion section. Do not decide it." +
              (c.note ? "\n\nWhat matters to me: " + c.note : ""),
          },
          plan: {
            label: "Plan it",
            hint: "The agent writes a plan for an accepted gap: steps, checks, what must be decided first. No code is changed.",
            ask: "Limits or wishes for the plan (optional)",
            text: (c) =>
              "Use the project-knowledge skill to plan this gap. Plan only, do not build it, and only if its decision is accepted; otherwise tell me what is missing." +
              (c.note ? "\n\nKeep in mind: " + c.note : ""),
          },
          change: {
            label: "Change the behavior",
            hint: "You want the product to work differently. Say what should change: the agent changes the code, then corrects this page so it says what the code does now.",
            ask: "What should be different, and for whom",
            // The change itself comes first, as an order. A request that opens with "ask your questions
            // first" makes the agent stop and wait even when everything was said.
            text: (c) =>
              "I want to change the behavior this page describes.\n\nMake this change: " + (c.note || "[describe the change]") +
              "\n\nWhen the code is done, record the change in the spec as the project-knowledge skill describes (Record a change): correct only the rules that changed, and keep their numbers." +
              (c.node && isGap(c.node) ? " If the change answers this gap, close the gap as done there and name the rule that now says it." : ""),
          },
          review: {
            label: "Review one topic",
            hint: "The agent goes through this page's code with a fixed list of questions about one topic. What the code answers becomes a rule on the page; each doubt becomes a gap. No code is changed.",
            ask: "Anything it should look at (optional)",
            choices: ["topic", REVIEWS.map((r) => [r[0], r[1]])],
            text: (c) =>
              "Use the project-knowledge skill in review mode: review what this page covers for " +
              reviewPhrase(c.topic) +
              ". Follow the skill's review guide and its questions for this topic, read the code and run nothing. Write what matters as gaps with the topic the guide names, note the small things as the guide says, and do not decide any." +
              (c.note ? "\n\nLook at: " + c.note : ""),
          },
          question: {
            label: "Ask a question",
            hint: "The agent investigates and answers from the code, saying what it actually checked.",
            ask: "Your question",
            text: (c) => "Use the project-knowledge skill to investigate a question about this page.\n\nQuestion: " + (c.note || "[your question]"),
          },
          remove: {
            label: "Remove this page",
            hint: "You think this page is noise. The agent deletes the file and fixes the pages that link to it. For a real question you disagree with, record a decision to reject it instead, so the answer is kept.",
            ask: "Why it should go (optional)",
            text: (c) =>
              "Use the project-knowledge skill to remove this page from the vault: " + (c.note || "I consider it noise") +
              ".\n\nDelete the file, remove or reword every link to it on other pages, and run check. Do not put another page in its place, and tell me what you removed.",
          },
          reread: {
            label: "Re-read against the code",
            hint: "The agent compares this page with its sources and updates the text where the code now differs.",
            ask: "Anything that looks wrong to you (optional)",
            text: (c) =>
              "Use the project-knowledge skill to re-read this page against its sources and update it where the code now differs." +
              (c.note ? "\n\nI suspect: " + c.note : ""),
          },
        };
        const intentsFor = (n) =>
          isGap(n)
            ? ["recheck", "checked", "decide", "options", "plan", "change", "remove"]
            : layerOf(n) === "spec"
              ? ["change", "question", "review", "reread", "remove"]
              : n.type === "index"
                ? ["question"]
                : ["question", "remove"];
        const refsOf = (n) =>
          isGap(n)
            ? neighbours(n, "spec")
            : neighbours(n, "spec").filter((r) => r.type !== "area");
        let copyState = null;
        function pageBrief(n, state) {
          const lines = [
            INTENTS[state.intent].text({ ...state, note: state.note.trim(), me: state.me.trim() || "[your name]" }),
            "",
            (isGap(n) ? "Gap: " : "Page: ") + repoPath(n),
            "Title: " + n.title,
          ];
          if (isGap(n))
            lines.push(
              "State: " +
                [stateLabels[stateOf(n)].toLowerCase(), topicOf(n), (kindLabels[n.kind] || str(n.kind)).toLowerCase(), str(n.priority)]
                  .filter(Boolean)
                  .join(" · "),
            );
          const refs = refsOf(n);
          if (state.refs && refs.length) lines.push("", isGap(n) ? "It refers to:" : "Related pages:", pageLines(refs));
          if (state.text) lines.push("", "Text of the page:", "", bodyOf(n).trim());
          return lines.join("\n");
        }
        // While a dialog is open the page behind it stays put, so there is one scrollbar at most.
        function lockPage(on) {
          if (document.body && document.body.style) document.body.style.overflow = on ? "hidden" : "";
        }
        function openCopy(n) {
          lockPage(true);
          copyState = {
            node: n,
            intent: intentsFor(n)[0],
            outcome: "gone",
            topic: "security",
            decision: "accepted",
            note: "",
            me: str(store.get("me", "")),
            refs: true,
            text: false,
          };
          $("#copydlg").hidden = false;
          renderCopy();
        }
        function closeCopy() {
          lockPage(false);
          copyState = null;
          $("#copydlg").hidden = true;
          $("#copy-card").replaceChildren();
        }
        function renderCopy() {
          const card = $("#copy-card"),
            n = copyState.node,
            intent = INTENTS[copyState.intent],
            refs = refsOf(n),
            pre = el("pre", pageBrief(n, copyState)),
            refresh = () => {
              pre.textContent = pageBrief(n, copyState);
            };
          pre.id = "copy-preview";
          card.replaceChildren();
          const top = el("div", null, "stack"),
            meta = el("div", null, "metarow");
          top.style.gap = "10px";
          meta.append(isGap(n) ? stateBadge(n) : statusBadge(n), el("span", repoPath(n), "path"));
          top.append(el("div", "Copy for AI", "eyebrow"), el("h2", n.title, "h2"), meta);

          const want = el("fieldset"),
            menu = pills("What should the agent do?", intentsFor(n).map((k) => [k, INTENTS[k].label]), copyState.intent, (v) => {
              copyState.intent = v;
              copyState.refocus = true;
              renderCopy();
            });
          menu.className = "pillrow menu";
          want.append(el("legend", "What should the agent do?"), menu);
          const hint = el("p", intent.hint, "muted small"),
            chosen = el("div", null, "stack");
          hint.id = "copy-hint";
          chosen.style.gap = "10px";
          chosen.append(hint);
          if (intent.choices) {
            const [key, options] = intent.choices,
              sub = pills(intent.label, options, copyState[key], (v) => {
                copyState[key] = v;
                renderCopy();
              });
            sub.id = "copy-choice";
            chosen.append(sub);
          }

          // Typing updates the preview in place, so the field keeps the cursor.
          const words = el("fieldset"),
            field = (id, label, value, rows, change) => {
              const tag = el("label", label, "field-label"),
                input = el(rows ? "textarea" : "input");
              tag.setAttribute("for", id);
              input.id = id;
              if (rows) input.rows = rows;
              else input.type = "text";
              input.value = value;
              input.addEventListener("input", () => {
                change(input.value);
                refresh();
              });
              words.append(tag, input);
            };
          field("copy-note", intent.ask, copyState.note, 2, (v) => {
            copyState.note = v;
          });
          if (intent.name)
            field("copy-me", "Your name, as it should appear in the gap", copyState.me, 0, (v) => {
              copyState.me = v;
              store.set("me", v.trim());
            });

          const include = el("fieldset", null, "checks");
          include.append(el("legend", "Include"));
          const check = (text, key) => {
            const label = el("label", null, "check"),
              input = el("input");
            input.type = "checkbox";
            input.checked = copyState[key];
            input.addEventListener("change", () => {
              copyState[key] = !!input.checked;
              refresh();
            });
            label.append(input, document.createTextNode(text));
            include.append(label);
          };
          if (refs.length) check(isGap(n) ? "The " + plural(refs.length, "spec page") + " it refers to" : "The " + plural(refs.length, "related page"), "refs");
          check("Full text of the page", "text");

          const actions = el("div", null, "actions"),
            copy = button(null, "btn accent", () => copyText(pageBrief(n, copyState), "Copied. Paste it into your agent.", copy, "Copied"));
          copy.id = "copy-do";
          copy.append(icon(ICON.copy), document.createTextNode("Copy"));
          actions.append(copy, button("Close", "btn", closeCopy), el("span", "Nothing is sent. It goes to your clipboard.", "muted small"));
          const preview = el("div", null, "night");
          preview.append(el("div", "What gets copied", "eyebrow"), pre);
          const list = el("div", null, "copy-menu"),
            controls = el("div", null, "copy-controls"),
            side = el("div", null, "copy-side");
          list.append(want);
          controls.append(chosen, words, include);
          side.append(preview, actions);
          card.append(top, list, controls, side);
          // The card was drawn again, so hand the keyboard back to the request that was picked.
          if (copyState.refocus) {
            copyState.refocus = false;
            const now = Array.from(menu.children).find((b) => b.getAttribute("aria-pressed") === "true");
            if (now && now.focus) now.focus();
          }
        }
        $("#copydlg").addEventListener("click", (e) => {
          if (e.target === $("#copydlg")) closeCopy();
        });

        // --- Search: pages, gaps and cited files, from anywhere -----------------------------------------
        let palette = { filter: "all", index: 0, hits: [] };
        const fileText = new Map();
        const lowerFile = (key) => {
          if (!fileText.has(key)) fileText.set(key, str(files[key] && files[key].text).toLocaleLowerCase());
          return fileText.get(key);
        };
        const marked = (text, needle) => {
          const span = el("span"),
            at = needle ? text.toLocaleLowerCase().indexOf(needle) : -1;
          if (at < 0) span.textContent = text;
          else
            span.append(
              document.createTextNode(text.slice(0, at)),
              el("mark", text.slice(at, at + needle.length)),
              document.createTextNode(text.slice(at + needle.length)),
            );
          return span;
        };
        function findPages(needle, list, limit) {
          const scored = [];
          list.forEach((n) => {
            const where = str(n.title).toLocaleLowerCase().includes(needle)
              ? 0
              : str(n.summary).toLocaleLowerCase().includes(needle)
                ? 1
                : str(n.body).toLocaleLowerCase().includes(needle)
                  ? 2
                  : -1;
            if (where >= 0) scored.push([where, n]);
          });
          return scored.sort((a, b) => a[0] - b[0] || byTitle(a[1], b[1])).slice(0, limit).map(([, n]) => n);
        }
        function searchGroups(query) {
          const needle = query.trim().toLocaleLowerCase(),
            want = (group) => palette.filter === "all" || palette.filter === group;
          if (!needle) {
            const lately = recent.map((id) => byId.get(id)).filter(Boolean);
            return [[lately.length ? "Recently viewed" : "Areas", "features", lately.length ? lately : areas]];
          }
          const groups = [];
          if (want("features"))
            groups.push(["Features", "features", findPages(needle, nodes.filter((n) => layerOf(n) === "spec" && n.status !== "superseded"), 8)]);
          if (want("gaps")) groups.push(["Gaps", "gaps", findPages(needle, nodes.filter((n) => layerOf(n) === "gap"), 8)]);
          if (want("features"))
            groups.push(["Other pages", "features", findPages(needle, nodes.filter((n) => layerOf(n) === "nav"), 4)]);
          if (want("files")) {
            const keys = Object.keys(files),
              byName = keys.filter((k) => k.toLocaleLowerCase().includes(needle)),
              byText = keys.filter((k) => !byName.includes(k) && lowerFile(k).includes(needle));
            groups.push(["Files", "files", [...byName, ...byText].slice(0, 6)]);
          }
          return groups.filter(([, , items]) => items.length);
        }
        function choose(hit) {
          closePalette();
          if (typeof hit === "string") return openFile({ key: hit, from: 0, to: 0 });
          openNode(hit);
        }
        function renderPalette() {
          const query = $("#palette-input").value,
            needle = query.trim().toLocaleLowerCase(),
            filters = $("#palette-filters"),
            results = $("#palette-results");
          filters.replaceChildren(
            ...pills(
              "Limit results",
              [["all", "Everything"], ["features", "Features"], ["gaps", "Gaps"], ["files", "Files"]],
              palette.filter,
              (v) => {
                palette.filter = v;
                palette.index = 0;
                renderPalette();
              },
            ).children,
          );
          results.replaceChildren();
          palette.hits = [];
          searchGroups(query).forEach(([title, , items]) => {
            results.append(el("div", title, "eyebrow"));
            items.forEach((item) => {
              const i = palette.hits.length,
                b = button(null, "result", () => choose(item)),
                grow = el("span", null, "grow");
              palette.hits.push(item);
              b.setAttribute("aria-selected", String(i === palette.index));
              if (typeof item === "string") {
                const name = marked(item, needle);
                name.className = "path";
                grow.append(name);
                b.append(grow, el("span", "cited file", "muted small"));
              } else {
                const name = marked(item.title, needle),
                  parent = item.type === "note" ? byId.get(primaryArea(item)) : null;
                name.className = "name";
                grow.append(name, el("span", parent ? parent.title : types[item.type] || "", "muted small"));
                b.append(grow);
                if (isGap(item)) b.append(stateBadge(item));
              }
              results.append(b);
            });
          });
          if (!palette.hits.length) results.append(el("p", needle ? "Nothing matches." : "Type to search.", "empty"));
          if (palette.index >= palette.hits.length) palette.index = Math.max(0, palette.hits.length - 1);
        }
        function openPalette() {
          palette = { filter: "all", index: 0, hits: [] };
          const input = $("#palette-input");
          input.value = "";
          $("#palette").hidden = false;
          lockPage(true);
          renderPalette();
          if (typeof input.focus === "function") input.focus();
        }
        function closePalette() {
          lockPage(false);
          $("#palette").hidden = true;
        }
        $("#palette-input").addEventListener("input", () => {
          palette.index = 0;
          renderPalette();
        });
        $("#palette-input").addEventListener("keydown", (e) => {
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            const count = palette.hits.length;
            if (count) palette.index = (palette.index + (e.key === "ArrowDown" ? 1 : count - 1)) % count;
            renderPalette();
          } else if (e.key === "Enter") {
            e.preventDefault();
            if (palette.hits[palette.index] != null) choose(palette.hits[palette.index]);
          }
        });
        $("#palette").addEventListener("click", (e) => {
          if (e.target === $("#palette")) closePalette();
        });
        if (typeof document.addEventListener === "function")
          document.addEventListener("keydown", (e) => {
            if ((e.metaKey || e.ctrlKey) && String(e.key).toLowerCase() === "k") {
              e.preventDefault();
              openPalette();
            } else if (e.key === "Escape") {
              if (!$("#palette").hidden) closePalette();
              else if (!$("#copydlg").hidden) closeCopy();
            }
          });

        // --- Put the current route on screen -------------------------------------------------------------
        let shownRoute = null;
        function show() {
          route = trail[at];
          let node = route.name === "page" ? byId.get(route.id) : null;
          if (route.name === "page" && !node) route = trail[at] = { name: "home", id: "" };
          selected = node || null;
          if (node) {
            remember(node);
            const area = node.type === "area" ? node.id : node.type === "note" ? primaryArea(node) : "";
            if (area) openAreas.add(area);
          }
          renderSide();
          renderTop();
          const view = $("#view"),
            isMap = route.name === "map";
          view.replaceChildren();
          view.hidden = isMap;
          $("#mapview").hidden = !isMap;
          if (route.name === "page") viewPage(view, node);
          else if (route.name === "gaps") viewGaps(view);
          else if (isMap) viewMap();
          else if (route.name === "changes") viewChanges(view);
          else viewHome(view);
          document.title = (node ? node.title + " · " : "") + projectTitle;
          if (shownRoute && sameRoute(shownRoute, route)) return;
          shownRoute = route;
          if (hasWindow && typeof window.scrollTo === "function") window.scrollTo(0, 0);
        }
        function graphModel(shown) {
          if (mode !== "gap")
            return { items: shown, links: edges, context: new Set() };
          const core = new Map(shown.map((n) => [n.id, n]));
          const plans = nodes.filter((p) => isPlan(p) && core.has(p.gap));
          plans.forEach((p) => core.set(p.id, p));
          const context = new Map();
          edges.forEach((e) =>
            [
              [e.source, e.target],
              [e.target, e.source],
            ].forEach(([a, b]) => {
              const o = byId.get(b);
              if (core.has(a) && o && layerOf(o) === "spec")
                context.set(o.id, o);
            }),
          );
          return {
            items: [...core.values(), ...context.values()],
            links: edges.concat(
              plans.map((p) => ({ source: p.id, target: p.gap })),
            ),
            context: new Set(context.keys()),
          };
        }
        // One labelled frame per area with its pages inside. Membership is shown by the frame,
        // so only real links are drawn; index, coverage and run pages are not part of the map.
        function draw(model, preserveView) {
          const shown = model.items.filter((n) => layerOf(n) !== "nav"),
            ids = new Set(shown.map((n) => n.id));
          graph.replaceChildren();
          const keyOf = (n) => (n.type === "area" ? n.id : (n.areas || [])[0] || "");
          const groups = new Map();
          shown.forEach((n) => {
            const key = keyOf(n);
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(n);
          });
          const CW = 190,
            CH = 92,
            PAD = 24,
            HEAD = 48,
            GAP = 34;
          const titleOf = (key) =>
            str(byId.get(key)?.title) || (key ? String(key) : "Other");
          const clusters = [...groups.entries()]
            .map(([key, group]) => {
              const head = group.find((n) => n.type === "area") || null;
              const members = group
                .filter((n) => n !== head)
                .sort((x, y) =>
                  model.context.has(x.id) !== model.context.has(y.id)
                    ? model.context.has(x.id)
                      ? 1
                      : -1
                    : byGapOrder(x, y),
                );
              const cols = Math.max(
                1,
                Math.min(5, Math.ceil(Math.sqrt(members.length))),
              );
              const rows = Math.ceil(members.length / cols);
              return {
                key,
                head,
                members,
                cols,
                title: titleOf(key),
                w: Math.max(cols * CW, 250) + PAD * 2,
                h: HEAD + rows * CH + (rows ? PAD / 2 : 0),
              };
            })
            .sort(
              (x, y) =>
                !x.key - !y.key ||
                x.title.localeCompare(y.title) ||
                String(x.key).localeCompare(String(y.key)),
            );
          // Shelf packing: fill rows up to a width that keeps the whole map roughly landscape.
          const area = clusters.reduce((t, c) => t + (c.w + GAP) * (c.h + GAP), 0);
          const rowWidth = Math.max(900, Math.sqrt(area * 1.8));
          const positions = new Map();
          let x = GAP,
            y = GAP,
            rowH = 0,
            maxW = 0;
          clusters.forEach((c) => {
            if (x > GAP && x + c.w > rowWidth) {
              x = GAP;
              y += rowH + GAP;
              rowH = 0;
            }
            c.x = x;
            c.y = y;
            if (c.head) positions.set(c.head.id, { x: x + PAD + 12, y: y + 26 });
            const inset = (c.w - c.cols * CW) / 2;
            c.members.forEach((n, i) =>
              positions.set(n.id, {
                x: x + inset + (i % c.cols) * CW + CW / 2,
                y: y + HEAD + Math.floor(i / c.cols) * CH + 26,
              }),
            );
            x += c.w + GAP;
            rowH = Math.max(rowH, c.h);
            maxW = Math.max(maxW, x);
          });
          initialBox = {
            x: 0,
            y: 0,
            w: Math.max(700, maxW),
            h: Math.max(430, y + rowH + GAP),
          };
          if (!preserveView) box = { ...initialBox };
          applyBox();
          const layer = sv("g", {});
          graph.append(layer);
          const clip = (text, max) =>
            text.length > max ? text.slice(0, max - 1) + "…" : text;
          clusters.forEach((c) => {
            layer.append(
              sv("rect", {
                class: "cluster",
                x: c.x,
                y: c.y,
                width: c.w,
                height: c.h,
                rx: 14,
              }),
            );
            if (!c.head) {
              const t = sv("text", {
                class: "cluster-label",
                x: c.x + PAD,
                y: c.y + 31,
              });
              t.textContent = clip(c.title, Math.floor((c.w - PAD * 2) / 9));
              layer.append(t);
            }
          });
          model.links.forEach((e) => {
            if (!ids.has(e.source) || !ids.has(e.target)) return;
            const na = byId.get(e.source),
              nb = byId.get(e.target),
              a = positions.get(e.source),
              b = positions.get(e.target);
            if (!na || !nb || !a || !b) return;
            // The frame already says which area a page belongs to.
            if (
              (na.type === "area" && keyOf(nb) === na.id) ||
              (nb.type === "area" && keyOf(na) === nb.id)
            )
              return;
            layer.append(
              sv("line", {
                class: keyOf(na) === keyOf(nb) ? "" : "cross",
                x1: a.x,
                y1: a.y,
                x2: b.x,
                y2: b.y,
              }),
            );
          });
          const widthOf = new Map(clusters.map((c) => [c.key, c.w]));
          shown.forEach((n) => {
            const p = positions.get(n.id),
              state = stateOf(n),
              isArea = n.type === "area",
              g = sv("g", {
                class:
                  "graph-node " +
                  (isArea ? "area " : "") +
                  (isPlan(n) ? "plan-node " : "") +
                  (model.context.has(n.id) ? "context " : "") +
                  stateClass(n) +
                  (selected?.id === n.id ? " selected" : ""),
                transform: `translate(${p.x} ${p.y})`,
                tabindex: "0",
                role: "button",
                "aria-label":
                  n.title +
                  (state
                    ? " (" + stateLabels[state] + ")" +
                      (recheckOutdated(n) ? ", recheck outdated" : "")
                    : isPlan(n)
                      ? " (Plan)"
                      : ""),
              });
            if (isPlan(n))
              g.append(sv("rect", { x: -12, y: -12, width: 24, height: 24, rx: 4 }));
            else
              g.append(
                sv("circle", {
                  r: isArea
                    ? 11
                    : ["needs-recheck", "needs-decision"].includes(state)
                      ? 16
                      : 13,
                }),
              );
            const t = isArea
              ? sv("text", { x: 20, y: 5, "text-anchor": "start" })
              : sv("text", { x: 0, y: 32, "text-anchor": "middle" });
            t.textContent = clip(
              String(n.title || ""),
              isArea ? Math.floor((widthOf.get(n.id) - PAD * 2 - 32) / 9) : 26,
            );
            g.append(t);
            g.addEventListener("click", () => openNode(n));
            g.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                openNode(n);
              }
            });
            layer.append(g);
          });
        }
        function applyBox() {
          graph.setAttribute("viewBox", `${box.x} ${box.y} ${box.w} ${box.h}`);
        }
        // f below 1 zooms in. (cx, cy) is the point of the map that stays where it is, as a share of the
        // view: the middle for the buttons, the pointer for the wheel. Zoom stops at 8x in and 4x out.
        function zoom(f, cx = 0.5, cy = 0.5) {
          const w = Math.min(Math.max(box.w * f, initialBox.w / 8), initialBox.w * 4),
            k = w / box.w,
            h = box.h * k;
          box.x += (box.w - w) * cx;
          box.y += (box.h - h) * cy;
          box.w = w;
          box.h = h;
          applyBox();
        }
        graph.addEventListener(
          "wheel",
          (e) => {
            if (!e.deltaY) return;
            e.preventDefault(); // the map takes the wheel; the page beside it still scrolls
            const rect = graph.getBoundingClientRect(),
              share = (v, size) => (size ? Math.min(Math.max(v / size, 0), 1) : 0.5);
            zoom(
              Math.exp(Math.max(-60, Math.min(60, e.deltaY)) * 0.004),
              share(e.clientX - rect.left, rect.width),
              share(e.clientY - rect.top, rect.height),
            );
          },
          { passive: false },
        );
        $("#zoom-in").addEventListener("click", () => zoom(0.8));
        $("#zoom-out").addEventListener("click", () => zoom(1.25));
        $("#reset").addEventListener("click", () => {
          box = { ...initialBox };
          applyBox();
        });
        let drag = null;
        graph.addEventListener("pointerdown", (e) => {
          if (e.target.closest(".graph-node")) return;
          drag = { x: e.clientX, y: e.clientY, box: { ...box } };
          graph.setPointerCapture(e.pointerId);
          graph.classList.add("dragging");
        });
        graph.addEventListener("pointermove", (e) => {
          if (!drag) return;
          const rect = graph.getBoundingClientRect();
          box.x = drag.box.x - ((e.clientX - drag.x) * drag.box.w) / rect.width;
          box.y =
            drag.box.y - ((e.clientY - drag.y) * drag.box.h) / rect.height;
          applyBox();
        });
        graph.addEventListener("pointerup", () => {
          drag = null;
          graph.classList.remove("dragging");
        });
        graph.addEventListener("pointercancel", () => {
          drag = null;
          graph.classList.remove("dragging");
        });
        if (hasWindow)
          window.addEventListener("popstate", (e) => {
            const s = e.state;
            if (s && Number.isInteger(s.at) && trail[s.at] && s.route && sameRoute(trail[s.at], s.route)) at = s.at;
            else {
              // A reload or a typed address: start a fresh trail at that place.
              trail.splice(0, trail.length, s && s.route && ROUTES.includes(s.route.name) ? s.route : parseHash(location.hash));
              at = 0;
            }
            show();
          });
        // An address typed or pasted into the bar changes only the part after #: follow it.
        if (hasWindow)
          window.addEventListener("hashchange", () => {
            const next = parseHash(location.hash);
            if (sameRoute(next, trail[at])) return;
            trail.splice(at + 1);
            trail.push(next);
            at = trail.length - 1;
            try {
              history.replaceState({ at, route: next }, "", routeHash(next));
            } catch {
              /* the trail works without it */
            }
            show();
          });
        const first = typeof location !== "undefined" ? parseHash(location.hash) : { name: "home", id: "" };
        trail.push(first);
        at = 0;
        if (hasWindow) {
          try {
            history.replaceState({ at: 0, route: first }, "", routeHash(first));
          } catch {
            /* the trail works without it */
          }
        }
        show();
      })();
    </script>
  </body>
</html>
