<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spec</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cstyle%3Epath%7Bstroke:%23111214%7D@media(prefers-color-scheme:dark)%7Bpath%7Bstroke:%23fff%7D%7D%3C/style%3E%3Cpath d='M26 11H16v42h10' fill='none' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='32' y='22' width='20' height='20' rx='4' fill='%23eba417'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: light;
        --paper: #ffffff;
        --soft: #f5f4f1;
        --raised: #fafaf8;
        --night: #0e0f11;
        --ink: #111214;
        --muted: #5b5e66;
        --subtle: #8a8d94;
        --line: #e7e5e1;
        --line-strong: #d9d6d0;
        --accent: #eba417;
        --accent-soft: #fcefcf;
        --accent-ink: #a16207;
        --success: #15803d;
        --success-soft: #e8f5ec;
        --notice-soft: #fff7e6;
        --notice-ink: #3d2a00;
        --notice-line: #f3d9a4;
        --on-night-muted: #a9acb3;
        --display: "Inter Tight", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 15px/1.55 var(--sans);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      /* Shell: the tree stays on the left, the page scrolls on the right. */
      .app {
        display: flex;
        align-items: flex-start;
        min-height: 100vh;
      }
      .side {
        flex: 0 0 304px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
        padding: 24px 16px 32px;
        border-right: 1px solid var(--line);
        background: var(--raised);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .main {
        flex: 1;
        min-width: 0;
      }
      .brand {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 0 10px;
      }
      .brand strong {
        font: 800 19px/1.2 var(--display);
        letter-spacing: -0.05em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mono-label,
      .eyebrow {
        font: 500 12px/1.33 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .eyebrow::before {
        content: "";
        flex: none;
        width: 6px;
        height: 6px;
        background: var(--accent);
      }
      .side .eyebrow {
        padding: 0 10px;
      }
      .searchbox {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 44px;
        padding: 0 14px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--paper);
        color: var(--muted);
        font-size: 14px;
        text-align: left;
      }
      .searchbox span {
        flex: 1;
      }
      kbd {
        font: 12px var(--mono);
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 1px 6px;
        background: var(--paper);
      }
      .nav-links,
      .tree {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .nav-link,
      .tree-row {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 44px;
        padding: 6px 10px;
        border: 0;
        border-radius: 10px;
        background: none;
        font-size: 14px;
        line-height: 1.35;
        text-align: left;
      }
      .nav-link {
        font-weight: 500;
      }
      .nav-link span:first-child,
      .tree-row .label {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nav-link .meta,
      .tree-row .meta {
        flex: none;
        font: 12px var(--mono);
        color: var(--muted);
      }
      .tree-row .meta {
        color: var(--accent-ink);
      }
      .nav-link:hover,
      .tree-row:hover,
      .twist:hover {
        background: var(--soft);
      }
      .nav-link[aria-current="page"],
      .tree-row[aria-current="page"] {
        background: var(--soft);
        font-weight: 600;
        color: var(--ink);
      }
      .tree-area {
        display: flex;
        align-items: stretch;
      }
      .twist {
        flex: none;
        width: 32px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 10px;
        background: none;
        color: var(--muted);
      }
      .twist svg {
        transition: transform 0.12s;
      }
      .twist[aria-expanded="true"] svg {
        transform: rotate(90deg);
      }
      .tree-row.area {
        font-weight: 600;
        padding-left: 4px;
      }
      .tree-row.note {
        padding-left: 40px;
        color: var(--muted);
      }
      .tree-row.part {
        padding-left: 58px;
        font-size: 0.94em;
      }

      /* Top bar: where you are, and what you can do with the page. */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 68px;
        padding: 0 32px;
        border-bottom: 1px solid var(--line);
        background: var(--paper);
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--paper);
      }
      .icon-btn:disabled {
        border-color: var(--line);
        color: var(--subtle);
      }
      /* One line whatever the page is called, so the bar keeps its height from page to page. */
      .crumbs {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--muted);
        white-space: nowrap;
      }
      .crumbs > * {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .crumbs > span:not(.here) {
        flex: none;
      }
      /* When room runs out, the name of the page you are on gives way first, then the path before it. */
      .crumbs .here {
        flex-shrink: 50;
        min-width: 12ch;
      }
      .crumbs button {
        min-width: 4ch;
      }
      .crumbs button {
        border: 0;
        padding: 0;
        background: none;
        color: var(--muted);
        text-align: left;
        max-width: 28ch;
      }
      .crumbs button:hover {
        color: var(--accent-ink);
        text-decoration: underline;
      }
      .crumbs .here {
        color: var(--ink);
        font-weight: 600;
      }
      .toast {
        flex: none;
        font-size: 13px;
        color: var(--success);
        font-weight: 600;
      }
      /* When the button that was pressed says so itself, the message is kept for screen readers only. */
      .toast.quiet {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .btn.said {
        justify-content: center;
      }
      .btn.said:not(.accent) {
        color: var(--success);
      }
      /* Wide enough for "Link copied", so the button does not change size when it says so. */
      #copy-link {
        min-width: 112px;
        justify-content: center;
      }
      .btn {
        height: 36px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--paper);
        color: var(--ink);
        font: 600 14px/1 var(--sans);
        white-space: nowrap;
      }
      .btn:hover {
        border-color: var(--ink);
      }
      .btn.accent {
        border-color: var(--accent);
        background: var(--accent);
      }
      .btn.large {
        height: 40px;
        padding: 0 18px;
      }
      .pillrow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .pill {
        height: 34px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 0 13px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--paper);
        font: 600 13px/1 var(--sans);
      }
      .pill[aria-pressed="true"] {
        border-color: var(--ink);
        background: var(--ink);
        color: #ffffff;
      }
      .pill .n {
        font: 12px var(--mono);
        opacity: 0.75;
      }
      select {
        height: 34px;
        padding: 0 12px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--paper);
        font-size: 13px;
      }
      /* A finger needs more room than a mouse pointer. */
      @media (pointer: coarse) {
        .btn,
        .pill,
        select {
          height: 44px;
        }
        .icon-btn,
        .xbtn {
          width: 44px;
          height: 44px;
        }
      }

      /* Page */
      .view {
        padding: 40px 32px 80px;
      }
      /* The map takes the rest of the window: one row of controls, then the map, no page scroll. */
      .mapview {
        height: calc(100vh - 68px);
        padding: 14px 32px 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .map-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 16px;
      }
      .map-head h1 {
        font: 700 22px/1.2 var(--display);
        letter-spacing: -0.03em;
        white-space: nowrap;
      }
      .map-head .pill,
      .map-head select {
        height: 34px;
      }
      .map-head .pill {
        padding: 0 12px;
        font-size: 13px;
      }
      .map-head select {
        max-width: 220px;
      }
      .map-head .pillrow {
        gap: 6px;
      }
      /* The queue's states are tabs, plain words with a count, so the row of filters under them stays quiet. */
      .tabrow {
        display: flex;
        flex-wrap: wrap;
        gap: 0 22px;
        border-bottom: 1px solid var(--line);
      }
      .tab {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        min-height: 36px;
        padding: 0 1px;
        margin-bottom: -1px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        color: var(--muted);
        font: 600 14px/1 var(--sans);
      }
      .tab:hover {
        color: var(--ink);
      }
      .tab[aria-pressed="true"] {
        color: var(--ink);
        border-bottom-color: var(--ink);
      }
      .tab .n {
        font: 12px var(--mono);
        opacity: 0.75;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .filters select {
        max-width: 220px;
      }
      .filters input[type="search"] {
        height: 34px;
        width: 200px;
        padding: 0 14px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--paper);
        font-size: 13px;
      }
      .filters input[type="search"]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      .stack.compact > .stack.compact > .card {
        max-width: 1100px;
      }
      .reviews .card {
        margin-top: 14px;
      }
      .reviews .row {
        flex-wrap: wrap;
      }
      .reviews .grow {
        min-width: 260px;
      }
      .reviews .row > .rowlink {
        font-size: 13.5px;
        font-weight: 500;
        text-decoration: underline;
        text-decoration-color: var(--line-strong);
        text-underline-offset: 3px;
      }
      .filters .push {
        margin-left: auto;
      }
      @media (pointer: coarse) {
        .tab {
          min-height: 44px;
        }
      }
      .view:has(> .compact) {
        padding-top: 18px;
      }
      .stack.compact {
        gap: 14px;
        max-width: none;
      }
      .stack.compact > .card {
        max-width: 1100px;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 24px;
        max-width: 860px;
      }
      .stack.wide {
        max-width: 1100px;
      }
      .area-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
      }
      .area-card h2 button {
        border: 0;
        padding: 0;
        background: none;
        font: inherit;
        text-align: left;
      }
      .area-card h2 button:hover {
        text-decoration: underline;
      }
      .area-card .names {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 4px;
      }
      .area-card .names button {
        border: 0;
        padding: 0;
        background: none;
        font-size: 14px;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .area-card .names button:hover {
        color: var(--accent-ink);
        text-decoration: underline;
      }
      .area-card .names button.more {
        color: var(--muted);
        font-size: 13px;
      }
      .page {
        display: flex;
        flex-wrap: wrap;
        gap: 48px;
        align-items: flex-start;
      }
      .page-main {
        flex: 999 1 520px;
        min-width: 0;
        max-width: 780px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .rail {
        flex: 1 1 240px;
        max-width: 320px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .title {
        font: 700 44px/1.04 var(--display);
        letter-spacing: -0.045em;
        overflow-wrap: anywhere;
      }
      .title .quiet {
        color: var(--subtle);
      }
      .h2 {
        font: 700 22px/1.2 var(--display);
        letter-spacing: -0.03em;
      }
      .h2 button {
        border: 0;
        padding: 0;
        background: none;
        font: inherit;
        letter-spacing: inherit;
        text-align: left;
      }
      .h2 button:hover {
        color: var(--accent-ink);
      }
      .lead {
        font-size: 19px;
        line-height: 1.55;
        color: var(--muted);
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 13px;
      }
      .path {
        font: 13px var(--mono);
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .metarow {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        background: var(--soft);
        color: var(--ink);
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .badge::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--subtle);
      }
      .badge.ok {
        background: var(--success-soft);
        color: var(--success);
      }
      .badge.ok::before,
      .badge.st-accepted::before,
      .badge.st-done::before {
        background: var(--success);
      }
      .badge.st-needs-recheck,
      .badge.outdated,
      .badge.stale,
      .badge.pending {
        background: var(--accent-soft);
        color: var(--notice-ink);
      }
      .badge.st-needs-recheck::before,
      .badge.outdated::before,
      .badge.stale::before,
      .badge.pending::before {
        background: var(--accent);
      }
      .badge.st-needs-decision::before {
        background: var(--ink);
      }
      .badge.st-accepted,
      .badge.st-done {
        background: var(--success-soft);
        color: var(--success);
      }
      .badge.plain::before {
        display: none;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        min-height: 32px;
        display: inline-flex;
        align-items: center;
        padding: 4px 13px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
        font-size: 14px;
        text-align: left;
      }
      .chip:hover {
        border-color: var(--ink);
      }
      .card {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: 20px;
        overflow: hidden;
      }
      .card.pad {
        padding: 20px;
        gap: 12px;
      }
      .card-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
      }
      .card-head .h2 {
        flex: 1 1 240px;
      }
      .card.notice {
        border-color: var(--notice-line);
      }
      .card.notice .card-head {
        background: var(--notice-soft);
        color: var(--notice-ink);
        border-color: var(--notice-line);
      }
      .row .errs {
        flex: 1 1 100%;
        margin: 0 0 6px;
        padding-left: 18px;
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        min-height: 52px;
        padding: 10px 20px;
        border-bottom: 1px solid var(--line);
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row.slim {
        min-height: 44px;
        padding: 6px 20px;
      }
      .row.slim .grow {
        flex: 1 1 200px;
      }
      .row.slim .rowlink,
      .row.slim .grow > span {
        max-width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row.slim .path {
        flex: 0 1 auto;
        max-width: 38%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* What happened to a page: a small label of one width, so the names after it line up. */
      .tag {
        flex: none;
        width: 74px;
        padding: 3px 0;
        border-radius: 999px;
        background: var(--soft);
        font: 500 10.5px/1.4 var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-align: center;
        color: var(--muted);
      }
      .tag.added {
        background: var(--success-soft);
        color: var(--success);
      }
      .tag.removed {
        text-decoration: line-through;
      }
      details.what {
        flex: none;
        font-size: 13px;
      }
      details.what > summary {
        cursor: pointer;
        color: var(--accent-ink);
      }
      details.what[open] {
        flex: 1 1 100%;
        order: 9;
      }
      details.what[open] > summary {
        margin-bottom: 6px;
      }
      .group {
        padding: 12px 20px 4px;
      }
      /* Inside a commit the page list is a quiet block under the commit's line: one tint, no rule between the
         rows, names in a lighter weight than the commit's own title, and the file path small at the end. */
      .commit details > .row.slim,
      .commit details > .group {
        background: var(--raised);
      }
      .commit details > .row.slim {
        min-height: 36px;
        padding: 5px 20px;
        border-bottom: 0;
      }
      .commit details > .group {
        padding: 16px 20px 6px;
      }
      .commit details > .row.slim:last-child {
        padding-bottom: 16px;
      }
      .commit details > summary + .row.slim {
        padding-top: 12px;
      }
      .commit .row.slim .rowlink,
      .commit .row.slim .grow > span {
        font-size: 14.5px;
        font-weight: 500;
      }
      .commit .row.slim .path {
        font-size: 12px;
        color: var(--subtle);
      }
      .commit summary.card-head {
        cursor: pointer;
        list-style: none;
        border-bottom: 0;
        flex-wrap: nowrap;
      }
      .commit summary.card-head::-webkit-details-marker {
        display: none;
      }
      .commit summary.card-head:hover {
        background: var(--raised);
      }
      .commit summary.card-head svg {
        flex: none;
        color: var(--muted);
        transition: transform 0.12s;
      }
      .commit details[open] > summary.card-head {
        border-bottom: 1px solid var(--line);
      }
      .commit details[open] > summary.card-head svg {
        transform: rotate(90deg);
      }
      .commit .grow {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .h3 {
        font: 600 16px/1.3 var(--sans);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .grow {
        flex: 1 1 260px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .rowlink {
        border: 0;
        padding: 0;
        background: none;
        font-weight: 600;
        text-align: left;
      }
      .rowlink:hover {
        color: var(--accent-ink);
        text-decoration: underline;
      }
      .feature {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 14px 0;
        border-top: 1px solid var(--line);
      }
      .feature .rowlink {
        font-size: 16px;
      }
      details.fold {
        border-top: 1px solid var(--line);
      }
      details.fold:last-of-type {
        border-bottom: 1px solid var(--line);
      }
      details.fold > summary {
        min-height: 52px;
        display: flex;
        align-items: center;
        cursor: pointer;
        font-weight: 600;
      }
      details.fold[open] > summary {
        margin-bottom: 8px;
      }
      details.fold > :last-child {
        margin-bottom: 20px;
      }
      .fold-rows .row {
        padding-left: 0;
        padding-right: 0;
      }
      .more-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .here-path {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 14px;
      }
      .here-path button {
        border: 0;
        border-left: 1px solid var(--line-strong);
        padding: 0 0 0 14px;
        background: none;
        color: var(--muted);
        text-align: left;
      }
      .here-path button:first-child {
        border-left: 0;
        padding-left: 0;
      }
      .here-path .now {
        margin-left: 14px;
        padding-left: 14px;
        border-left: 2px solid var(--ink);
        font-weight: 600;
      }
      .recent {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .recent button {
        border: 0;
        padding: 0;
        background: none;
        font-size: 14px;
        text-align: left;
      }
      .recent button.more {
        font-size: 13px;
        color: var(--muted);
      }
      .pagefoot {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 14px;
      }
      .recent button:hover,
      .here-path button:hover {
        color: var(--accent-ink);
        text-decoration: underline;
      }
      .gap-facts {
        padding: 16px 20px;
        border: 1px solid var(--line);
        border-left: 4px solid var(--subtle);
        border-radius: 14px;
        background: var(--raised);
      }
      .gap-facts.st-needs-recheck {
        border-left-color: var(--accent);
      }
      .gap-facts.st-needs-decision {
        border-left-color: var(--ink);
      }
      .gap-facts.st-accepted,
      .gap-facts.st-done {
        border-left-color: var(--success);
      }
      .gap-facts dl {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr);
        gap: 8px 16px;
        margin: 0;
        font-size: 14px;
      }
      .gap-facts dt {
        color: var(--muted);
      }
      .gap-facts dd {
        margin: 0;
      }
      .link-block h2 {
        font: 500 12px/1.33 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .link-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .link-list li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
      }
      .wasnow {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--raised);
        font-size: 14px;
      }
      .wasnow div {
        display: flex;
        gap: 10px;
      }
      .wasnow b {
        flex: none;
        width: 32px;
        font: 13px var(--mono);
        color: var(--muted);
      }
      .wasnow .was span {
        color: var(--muted);
        text-decoration: line-through;
      }
      textarea {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--line-strong);
        border-radius: 14px;
        background: var(--paper);
        font: 16px/1.6 var(--sans);
        resize: vertical;
      }
      .night {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 20px;
        border-radius: 20px;
        background: var(--night);
        color: #ffffff;
        min-width: 0;
      }
      .night .eyebrow,
      .night .small {
        color: var(--on-night-muted);
      }
      .night pre {
        margin: 0;
        max-height: 420px;
        overflow: auto;
        font: 13px/1.6 var(--mono);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .xbtn {
        flex: none;
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 999px;
        background: none;
        color: var(--muted);
      }
      .xbtn:hover {
        background: var(--soft);
        color: var(--ink);
      }

      /* Markdown */
      .article {
        line-height: 1.7;
        overflow-wrap: anywhere;
      }
      .article h1,
      .article h2,
      .article h3,
      .article h4 {
        margin: 26px 0 10px;
        font-family: var(--display);
        letter-spacing: -0.03em;
        line-height: 1.2;
      }
      .article > :first-child {
        margin-top: 0;
      }
      .article h1 {
        font-size: 26px;
      }
      .article h2 {
        font-size: 22px;
      }
      .article h3 {
        font-size: 17px;
      }
      .article p,
      .article ul,
      .article ol,
      .article pre {
        margin: 0 0 14px;
      }
      .article ul,
      .article ol {
        padding-left: 22px;
      }
      .article code {
        background: var(--soft);
        border-radius: 4px;
        padding: 1px 5px;
        font: 0.88em var(--mono);
      }
      .article pre {
        background: var(--soft);
        padding: 14px;
        overflow: auto;
        border-radius: 14px;
      }
      .article pre code {
        padding: 0;
      }
      .article a,
      .wiki {
        color: var(--ink);
        text-decoration: underline;
        text-decoration-color: var(--line-strong);
        text-underline-offset: 3px;
      }
      .article a:hover,
      .wiki:hover {
        color: var(--accent-ink);
        text-decoration-color: currentColor;
      }
      .wiki {
        border: 0;
        padding: 0;
        background: none;
        font: inherit;
        text-align: left;
      }
      .article .table-wrap {
        overflow: auto;
        margin: 0 0 14px;
      }
      .article table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
        line-height: 1.5;
        /* Whole words set the column widths; a table that is too wide scrolls instead of breaking words letter by letter. */
        overflow-wrap: break-word;
      }
      .article th,
      .article td {
        border: 1px solid var(--line);
        padding: 7px 10px;
        text-align: left;
        vertical-align: top;
      }
      .article td.rule-id {
        font: 12.5px/1.7 var(--mono);
        color: var(--muted);
        white-space: nowrap;
      }
      .article th {
        background: var(--soft);
        white-space: nowrap;
      }
      .empty {
        color: var(--muted);
        padding: 12px 0;
      }

      /* Map */
      .graph-wrap {
        position: relative;
        flex: 1;
        min-height: 320px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--raised);
        overflow: hidden;
      }
      .graph-wrap svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      .graph-wrap svg.dragging {
        cursor: grabbing;
      }
      .graph-wrap line {
        stroke: #b3afa6;
        stroke-width: 1.5;
      }
      .graph-wrap line.cross {
        stroke: #cdc9c1;
        stroke-dasharray: 5 4;
      }
      .graph-wrap rect.cluster {
        fill: var(--paper);
        stroke: var(--line);
        stroke-width: 1.5;
      }
      .graph-node {
        cursor: pointer;
      }
      .graph-node circle,
      .graph-node rect {
        fill: var(--paper);
        stroke: var(--ink);
        stroke-width: 2;
      }
      .graph-node.area circle {
        fill: var(--ink);
      }
      .graph-node text {
        font-size: 12px;
        fill: var(--muted);
        paint-order: stroke;
        stroke: var(--paper);
        stroke-width: 4px;
        stroke-linejoin: round;
      }
      .graph-wrap text.cluster-label,
      .graph-node.area text {
        font-size: 15px;
        font-weight: 650;
        fill: var(--ink);
      }
      .graph-node.context circle {
        stroke: var(--subtle);
        stroke-dasharray: 4 3;
      }
      .graph-node.context.area circle {
        fill: var(--paper);
      }
      .graph-node.st-needs-recheck circle {
        fill: var(--accent);
      }
      .graph-node.st-needs-decision circle {
        fill: var(--ink);
      }
      .graph-node.st-accepted circle {
        fill: var(--success);
        stroke: var(--success);
      }
      .graph-node.st-deferred circle,
      .graph-node.st-rejected circle,
      .graph-node.st-done circle,
      .graph-node.st-duplicate circle {
        fill: var(--soft);
        stroke: var(--subtle);
      }
      .graph-node.stale circle,
      .graph-node.pending circle {
        stroke: var(--accent);
        stroke-width: 3;
      }
      .graph-node.selected circle,
      .graph-node.selected rect {
        stroke: var(--accent-ink);
        stroke-width: 5;
      }
      .tools {
        position: absolute;
        right: 12px;
        bottom: 12px;
        display: flex;
        gap: 6px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
      }
      .tools button {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 999px;
        background: none;
        font-size: 18px;
      }
      .tools button:hover {
        background: var(--soft);
      }

      /* Overlays: search, copy, cited file */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 9vh 20px 20px;
        background: rgba(17, 18, 20, 0.35);
        overflow: auto;
      }
      .palette-card,
      .copy-card {
        width: min(720px, 100%);
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--paper);
        box-shadow:
          0 40px 90px -40px rgba(17, 18, 20, 0.35),
          0 2px 6px rgba(17, 18, 20, 0.04);
        overflow: hidden;
      }
      .palette-input {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 64px;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
      }
      .palette-input input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: none;
        background: none;
        font: 500 19px/1.3 var(--sans);
      }
      .palette-card .pillrow {
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
      }
      .palette-results {
        display: flex;
        flex-direction: column;
        padding: 8px 8px 12px;
        max-height: 56vh;
        overflow: auto;
      }
      .palette-results .eyebrow {
        padding: 12px 12px 6px;
      }
      .result {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 56px;
        padding: 8px 12px;
        border: 0;
        border-radius: 14px;
        background: none;
        text-align: left;
      }
      .result:hover,
      .result[aria-selected="true"] {
        background: var(--soft);
      }
      .result .grow {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .result .name {
        font-weight: 600;
      }
      .result mark {
        background: var(--accent-soft);
        color: inherit;
      }
      .palette-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        padding: 12px 20px;
        border-top: 1px solid var(--line);
        background: var(--raised);
        font: 12px var(--mono);
        color: var(--muted);
      }
      /* The dialog fits the window: what you choose on the left, what gets copied on the right. */
      #copydlg {
        align-items: center;
        padding: 20px;
        overflow: hidden;
      }
      /* One size whatever is chosen, so picking another request moves nothing: the list of requests, the
         fields for the chosen one and the text that gets copied each keep their place and scroll by themselves. */
      .copy-card {
        width: min(1080px, 100%);
        height: min(640px, calc(100vh - 40px));
        padding: 22px 24px 24px;
        display: grid;
        grid-template-columns: 188px minmax(0, 1fr) minmax(0, 1.15fr);
        grid-template-rows: auto minmax(0, 1fr);
        gap: 16px 24px;
        overflow: hidden;
      }
      .copy-card > .stack {
        grid-column: 1 / -1;
        max-width: none;
      }
      .copy-card > .stack .h2 {
        font-size: 18px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .copy-menu,
      .copy-controls,
      .copy-side {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
        min-height: 0;
      }
      .copy-menu,
      .copy-controls {
        overflow-y: auto;
      }
      /* A column that scrolls cuts off whatever is drawn outside it, a focus ring included: give the ring room
         and pull the column back by the same amount, so its content still lines up with the rest. */
      .copy-menu,
      .copy-controls {
        padding: 6px;
        margin: -6px;
      }
      /* A text field shows focus on its own border, which is calmer than a ring around a large box. */
      .copy-card textarea:focus-visible,
      .copy-card input[type="text"]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      /* The requests are a list to pick from, one under another. */
      .copy-card .menu {
        flex-direction: column;
        flex-wrap: nowrap;
        gap: 2px;
      }
      .copy-card .menu .pill {
        width: 100%;
        height: 36px;
        justify-content: flex-start;
        padding: 0 12px;
        border-color: transparent;
        border-radius: 12px;
        background: none;
        font-size: 14px;
        text-align: left;
      }
      .copy-card .menu .pill:hover {
        background: var(--soft);
      }
      .copy-card .menu .pill[aria-pressed="true"] {
        background: var(--ink);
        color: #ffffff;
      }
      /* Room for the longest explanation, so a shorter one does not pull the fields up. */
      #copy-hint {
        min-height: 5.8em;
      }
      .copy-card .pillrow {
        gap: 6px;
      }
      .copy-card .pill {
        height: 32px;
        padding: 0 12px;
        font-size: 13px;
      }
      .copy-card fieldset.checks {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 0 20px;
      }
      .copy-card fieldset.checks legend {
        width: 100%;
        float: left;
      }
      .copy-card .check {
        min-height: 32px;
      }
      .copy-card .btn {
        height: 36px;
      }
      .copy-side .night {
        flex: 1;
        min-height: 0;
      }
      .copy-side .night pre {
        flex: 1;
        min-height: 0;
        max-height: none;
      }
      @media (max-width: 880px) {
        .copy-card {
          height: auto;
          max-height: calc(100vh - 40px);
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto;
          overflow: auto;
        }
        .copy-menu,
        .copy-controls {
          overflow: visible;
        }
        .copy-card .menu {
          flex-direction: row;
          flex-wrap: wrap;
          gap: 6px;
        }
        .copy-card .menu .pill {
          width: auto;
          height: 32px;
          border-color: var(--line-strong);
          border-radius: 999px;
        }
        #copy-hint {
          min-height: 0;
        }
        .copy-side .night pre {
          max-height: 40vh;
        }
      }
      .copy-card fieldset {
        margin: 0;
        padding: 0;
        border: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .copy-card legend {
        padding: 0;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 600;
      }
      .field-label {
        font-size: 13px;
        font-weight: 600;
      }
      .copy-card input[type="text"] {
        width: 100%;
        height: 38px;
        padding: 0 12px;
        border: 1px solid var(--line-strong);
        border-radius: 14px;
        background: var(--paper);
        font-size: 15px;
      }
      .copy-card textarea {
        padding: 9px 12px;
        font-size: 15px;
        line-height: 1.45;
      }
      .copy-card .night {
        padding: 16px 18px;
        border-radius: 16px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 44px;
        font-size: 14px;
      }
      .check input {
        width: 18px;
        height: 18px;
        accent-color: var(--ink);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }
      .filepane {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        justify-content: flex-end;
        background: rgba(17, 18, 20, 0.35);
      }
      .file-card {
        width: min(1040px, 100%);
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--paper);
        border-left: 1px solid var(--line);
      }
      .file-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 14px 22px;
        border-bottom: 1px solid var(--line);
      }
      .file-name {
        flex: 1;
        min-width: 0;
      }
      .file-name strong {
        display: block;
        overflow-wrap: anywhere;
        font: 500 14px var(--mono);
      }
      .file-name small {
        font-size: 12px;
        color: var(--muted);
      }
      .file-actions {
        display: flex;
        gap: 6px;
      }
      .file-head button {
        height: 36px;
        padding: 0 14px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: var(--paper);
        font-size: 13px;
        font-weight: 600;
      }
      .file-head button[aria-pressed="true"] {
        border-color: var(--ink);
        background: var(--ink);
        color: #ffffff;
      }
      .file-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 26px 34px 60px;
      }
      .file-body > .article {
        max-width: 900px;
      }
      .code-view {
        font: 12.5px/1.55 var(--mono);
        min-width: max-content;
      }
      .ln {
        display: flex;
        gap: 14px;
        white-space: pre;
      }
      .ln .num {
        flex: 0 0 44px;
        text-align: right;
        color: var(--subtle);
        user-select: none;
      }
      .ln.hit {
        background: var(--accent-soft);
      }
      @media (max-width: 860px) {
        .app {
          display: block;
        }
        .side {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .tree {
          max-height: 40vh;
          overflow: auto;
        }
        .topbar,
        .view,
        .mapview {
          padding-left: 16px;
          padding-right: 16px;
        }
        .mapview {
          height: auto;
        }
        .graph-wrap {
          flex: none;
          height: 70vh;
        }
        .topbar .btn {
          padding: 0 12px;
        }
        .title {
          font-size: 32px;
        }
        .file-body {
          padding: 18px 16px 50px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>

        <div class="brand">
          <strong id="project-title"></strong
          ><span class="mono-label" id="header-note">Spec</span>
        </div>
        <button type="button" class="searchbox" id="open-search">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <span>Search</span><kbd>⌘K</kbd>
        </button>
        <div class="nav-links" id="nav-links"></div>
        <div class="eyebrow">Spec</div>
        <div class="tree" id="tree"></div>
      </nav>
      <main class="main">
        <div class="topbar">
          <button type="button" class="icon-btn" id="back" aria-label="Back">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="m11 6-6 6 6 6"></path></svg></button
          ><button type="button" class="icon-btn" id="forward" aria-label="Forward">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
          </button>
          <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
          <span class="toast" id="toast" role="status" aria-live="polite"></span>
          <button type="button" class="btn" id="copy-link">Copy link</button>
          <button type="button" class="btn accent" id="copy-ai">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></svg>
            Copy for AI

        // What the skill can look at on purpose, one topic per pass, and when each pass was last made.

          rows.forEach(([key, label, topic, what, phrase]) => {

        function viewPage(view, n) {
